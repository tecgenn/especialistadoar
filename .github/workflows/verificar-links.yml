name: Verificar links das Ofertas

on:
  schedule:
    # Diário às 06:00 UTC.
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: verificar-links
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verificar:
    name: verificar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Verificar links das Ofertas
        run: pnpm verificar-links
